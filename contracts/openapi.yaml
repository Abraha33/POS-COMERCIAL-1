        - productId
        - quantity
        - unitPrice
        - packed
        - missing
      properties:
        productId:
          type: string
        quantity:
          type: number
          exclusiveMinimum: 0
        unitPrice:
          type: integer
          minimum: 0
        packed:
          type: number
          minimum: 0
        missing:
          type: number
          minimum: 0
        missingNote:
          type: string
        name:
          type: string
        sku:
          type: string
    PosOrderCreate:
      type: object
      required:
        - customerId
        - fulfillment
        - lines
      properties:
        customerId:
          type:
            - string
            - "null"
        fulfillment:
          type: string
          enum:
            - domicilio
            - recogida
            - acordada
        address:
          type: string
        scheduledFor:
          type: string
        slot:
          type: string
          enum:
            - manana
            - tarde
            - noche
        shippingCost:
          type: integer
          minimum: 0
        notes:
          type: string
        saleId:
          type:
            - string
            - "null"
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PosOrderLine"
    PosOrder:
      allOf:
        - $ref: "#/components/schemas/PosOrderCreate"
        - type: object
          required:
            - id
            - number
            - status
            - total
            - paymentState
            - paidAmount
          properties:
            id:
              type: string
            number:
              type: string
            status:
              $ref: "#/components/schemas/PosOrderStatus"
            total:
              type: integer
              minimum: 0
            paymentState:
              type: string
              enum:
                - sin-pago
                - abono
                - pagado
                - credito
            paidAmount:
              type: integer
              minimum: 0
            qualityChecked:
              type: boolean
            branchId:
              type: string
            version:
              type: integer
              minimum: 0
              description: Versión guardada por el servidor; base de la concurrencia optimista de `savePosOrder`.
            customerName:
              type: string
            createdAt:
              type: string
            createdById:
              type: string
            createdByName:
              type: string
            assigneeId:
              type:
                - string
                - "null"
            assigneeName:
              type: string
            priority:
              type: string
              enum:
                - normal
                - alta
            history:
              type: array
              items:
                type: object
                required:
                  - at
                  - actorId
                  - actorName
                  - event
                properties:
                  at:
                    type: string
                  actorId:
                    type: string
                  actorName:
                    type: string
                  event:
                    type: string
                  detail:
                    type: string
    SavePosOrderRequest:
      type: object
      required:
        - order
        - expectedVersion
      properties:
        order:
          $ref: "#/components/schemas/PosOrder"
        expectedVersion:
          type: integer
          minimum: 0
          description: Versión que el cliente vio por última vez; 0 para un pedido nuevo.
    PosOrderTransition:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - tomar
            - empacar
            - reportar-faltante
            - resolver-faltante
            - verificar
            - registrar-pago
            - despachar
            - entregar
            - cancelar
        reason:
          type: string
        amount:
          type: integer
          minimum: 0
