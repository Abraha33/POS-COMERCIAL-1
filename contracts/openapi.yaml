        - openingCash
        - expectedCash
        - countedCash
        - difference
        - closingNote
        - status
      properties:
        id:
          type: string
        registerId:
          type: string
        branchId:
          type: string
        cashierId:
          type: string
        openedAt:
          type: string
          minLength: 10
        closedAt:
          type:
            - string
            - "null"
        openingCash:
          type: integer
          minimum: 0
        expectedCash:
          type: integer
          minimum: 0
        countedCash:
          type:
            - integer
            - "null"
          minimum: 0
        difference:
          type:
            - integer
            - "null"
        closingNote:
          type:
            - string
            - "null"
        status:
          type: string
