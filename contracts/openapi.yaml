    PaymentProofReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5 }
    PaymentProof:
      type: object
      required: [id, operationId, channelId, channelLabel, requestedBy, amount, destination, status, token, expiresAt, bankVerified, evidence, reviewedBy, reason]
      properties:
        id: { type: string }
        operationId: { type: string }
        channelId: { type: string }
        channelLabel: { type: string }
        requestedBy: { type: string, description: 'Empleado que solicitó el comprobante (lo fija el servidor).' }
        amount: { type: integer, minimum: 0 }
        destination: { type: string }
        status: { $ref: "#/components/schemas/PaymentProofStatus" }
        token: { type: string }
        expiresAt: { type: string }
        bankVerified: { type: boolean, description: 'Mock; excepción autorizada siempre false.' }
        evidence: { type: [object, 'null'], additionalProperties: true }
        reviewedBy: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
    PaymentProofPublic:
      type: object
      required: [operationId, channelId, channelLabel, requestedBy, amount, destination, status, expiresAt]
      properties:
        operationId: { type: string }
        channelId: { type: string }
        channelLabel: { type: string }
        requestedBy: { type: string }
        amount: { type: integer, minimum: 0 }
        destination: { type: string }
        status: { $ref: "#/components/schemas/PaymentProofStatus" }
        expiresAt: { type: string }
    SaleReceiptDocument:
