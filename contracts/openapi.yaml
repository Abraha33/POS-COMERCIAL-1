components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    From:
      name: from
      in: query
      required: false
      description: Fecha inicial inclusiva `YYYY-MM-DD`.
      schema:
        type: string
        minLength: 10
    To:
      name: to
      in: query
      required: false
      description: Fecha final inclusiva `YYYY-MM-DD`.
      schema:
        type: string
        minLength: 10
    BranchIdQuery:
      name: branchId
      in: query
      required: false
      description: Limita el resultado a una sede.
      schema:
        type: string
  responses:
    ValidationError:
      description: Datos inválidos (`VALIDATION_ERROR`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Sin sesión o credenciales inválidas (`UNAUTHORIZED`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Sin permiso (`FORBIDDEN`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No encontrado (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicto de negocio; `code` indica la regla
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    PaymentProofStatus:
      type: string
      enum: [pending_evidence, evidence_received, verifying, confirmed, rejected, exception_authorized, expired]
    PaymentProofCreate:
      type: object
      required: [operationId, channelId, channelLabel, amount, destination]
      properties:
        operationId: { type: string }
        channelId: { type: string }
        channelLabel: { type: string, minLength: 1, description: 'PROPUESTA (comprobantes): nombre legible del canal para el teléfono.' }
