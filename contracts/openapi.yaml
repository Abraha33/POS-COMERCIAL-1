        productId:
          type: string
        branchId:
          type: string
        createdAt:
          type: string
          minLength: 10
        resolved:
          type: boolean
    StockMovement:
      x-frappe-doctype: Stock Ledger Entry
      type: object
      required:
        - id
        - date
        - productId
        - branchId
        - type
        - quantity
        - reference
      properties:
        id:
