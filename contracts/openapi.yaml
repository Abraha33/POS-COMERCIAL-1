openapi: 3.1.0
info:
  title: ERP/POS API
  version: 0.6.0
  description: |
    Contrato compartido entre frontend (React) y backend (Frappe/ERPNext).

    **Estado: reglas APROBADAS por el dueño del negocio (ver docs/business-rules/); contrato pendiente de
    implementación y de validación contra Frappe.** Cada operación cita su BR-XXX. Las operaciones de v0.4.0 y v0.5.0
    (compras, cartera, administración, devoluciones, ajustes y conteos de inventario, reportes agregados, empresa y
    sedes) llevan `x-approval: proposed`: reglas propuestas, pendientes de aprobación del dueño
    (docs/business-rules/07 y 08). Cambios solo vía PR `contract:` revisado por el integrador
    (docs/architecture/BRANCHING.md).

    v0.5.0: campos derivados calculados por el servidor (`balance`, `status`, `daysOverdue`, `outstandingBalance`,
    `overdueBalance`); el cliente no los recalcula como autoridad.

    `x-status: simulated` = existe como mock MSW (frontend/src/mocks) que implementa las reglas aprobadas;
    el backend real aún no existe. `x-status: simulated` = operación PROPUESTA solo especificada (sin mock ni backend):
    capa 5 (turnos, autorizaciones, sincronización y pedidos).
    Dinero en el contrato: entero en COP (BR-GEN-01); el backend calcula internamente con más decimales.
    Errores: `Error` (BR-GEN-09).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: catalog
  - name: pos
  - name: inventory
  - name: purchases
  - name: ledger
  - name: reports
  - name: admin
paths:
  /auth/login:
    post:
      tags:
        - auth
      operationId: login
      x-status: simulated
      x-approval: approved
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/session:
    get:
      tags:
        - auth
      operationId: getSession
      x-status: simulated
      x-approval: approved
      responses:
        "200":
          description: Sesión vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /products:
    get:
      tags:
        - catalog
      operationId: listProducts
      x-status: simulated
      x-approval: approved
      responses:
        "200":
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      tags:
        - catalog
      operationId: createProduct
      x-status: simulated
      x-approval: approved
      description: BR-PRO-01, BR-PRO-02, BR-PRO-07.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /products/{id}:
    put:
      tags:
        - catalog
      operationId: updateProduct
      x-status: simulated
      x-approval: approved
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /customers:
    get:
      tags:
        - catalog
      operationId: listCustomers
      x-status: simulated
      x-approval: approved
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      tags:
        - catalog
      operationId: createCustomer
      x-status: simulated
      x-approval: proposed
      description: BR-CLI-01 (documento único). Roles cartera/admin/propietario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /suppliers:
    get:
      tags:
        - catalog
      operationId: listSuppliers
      x-status: simulated
      x-approval: approved
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      tags:
        - purchases
      operationId: createSupplier
      x-status: simulated
      x-approval: proposed
      description: Alta de proveedor. Roles comprador/admin/propietario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /employees:
    get:
      tags:
        - catalog
      operationId: listEmployees
      x-status: simulated
      x-approval: approved
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      tags:
        - catalog
      operationId: createEmployee
      x-status: simulated
      x-approval: proposed
      description: Alta de empleado/usuario. Solo admin/propietario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /stock/levels:
    get:
      tags:
        - inventory
      operationId: listStockLevels
      x-status: simulated
      x-approval: approved
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockLevel"
  /stock/movements:
    get:
      tags:
        - inventory
      operationId: listStockMovements
      x-status: simulated
      x-approval: approved
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovement"
  /purchase-orders:
    get:
      tags:
        - purchases
      operationId: listPurchaseOrders
      x-status: simulated
      x-approval: approved
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrder"
    post:
      tags:
        - purchases
      operationId: createPurchaseOrder
      x-status: simulated
      x-approval: proposed
      description: Crea una orden en estado `borrador`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderCreate"
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /receivables:
    get:
      tags:
        - ledger
      operationId: listReceivables
      x-status: simulated
      x-approval: approved
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Receivable"
  /payables:
    get:
      tags:
        - ledger
      operationId: listPayables
      x-status: simulated
      x-approval: approved
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payable"
  /sales:
    get:
      tags:
        - pos
      operationId: listSales
      x-status: simulated
      x-approval: approved
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
  /pos/sales:
    post:
      tags:
        - pos
      operationId: createSale
      x-status: simulated
      x-approval: approved
      summary: Confirma una venta (idempotente)
      description: |
        BR-VEN-01..14. El servidor fija precios, impuestos y totales (BR-GEN-06).
        `Idempotency-Key` debe ser igual a `clientOperationId`. Repetir la misma operación devuelve la misma venta con 200.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleCreate"
      responses:
        "200":
          description: Operación ya procesada; se devuelve la venta original
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleReceipt"
        "201":
          description: Venta creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleReceipt"
        "409":
          description: |
            Conflicto de negocio. `code` ∈ SHIFT_NOT_OPEN, STOCK_INSUFFICIENT, CREDIT_LIMIT_EXCEEDED,
            CUSTOMER_BLOCKED_OVERDUE, PRODUCT_INACTIVE, PAYMENT_INSUFFICIENT, DISCOUNT_NOT_ALLOWED,
            PRICE_BELOW_COST, APPROVAL_REQUIRED, APPROVAL_INVALID, IDEMPOTENCY_KEY_REUSED, REFERENCE_DUPLICATED (PROPUESTA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /pos/sales/{id}/void:
    post:
      tags:
        - pos
      operationId: voidSale
      x-status: simulated
      x-approval: approved
      description: BR-VEN-10. Requiere permiso `pos.refund` o turno abierto.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleVoid"
      responses:
        "200":
          description: Venta anulada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /pos/shifts/current:
    get:
      tags:
        - pos
      operationId: getCurrentShift
      x-status: simulated
      x-approval: approved
      description: Turno abierto del usuario en su caja, o 404 si no hay.
      responses:
        "200":
          description: Turno abierto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "404":
          $ref: "#/components/responses/NotFound"
  /pos/shifts:
    get:
      tags:
        - pos
      operationId: listShifts
      x-status: simulated
      x-approval: proposed
      description: |
        Historial de turnos con cuadre y diferencia. Filtros opcionales por fecha de apertura (`from`, `to`,
        inclusivos) y sede. Con `reports.view` ve todos los turnos; el cajero solo los propios; el resto, 403.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/BranchIdQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shift"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - pos
      operationId: openShift
      x-status: simulated
      x-approval: approved
      description: BR-CAJ-01, BR-CAJ-02. `SHIFT_ALREADY_OPEN` si la caja ya tiene turno abierto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftOpen"
      responses:
        "201":
          description: Turno abierto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /pos/shifts/{id}/close:
    post:
      tags:
        - pos
      operationId: closeShift
      x-status: simulated
      x-approval: approved
      description: BR-CAJ-05..08. Devuelve el turno con `difference` calculada.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftClose"
      responses:
        "200":
          description: Turno cerrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /pos/shifts/{id}/movements:
    post:
      tags:
        - pos
      operationId: addShiftMovement
      x-status: simulated
      x-approval: approved
      description: BR-CAJ-09. Ingresos (base/sencillo) y egresos tipificados; afectan `expectedCash`.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftMovement"
      responses:
        "200":
          description: Turno actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/supervisor-approvals:
    post:
      tags:
        - auth
      operationId: requestApproval
      x-status: simulated
      x-approval: approved
      description: |
        BR-VEN-04/05/14. Canjea el PIN de un supervisor por un token de un solo uso y corta vigencia, que luego
        se envía en `SaleCreate.approvalToken`. El PIN nunca viaja dentro de la venta. `below_cost` solo lo
        autoriza el propietario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Aprobación concedida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "403":
          $ref: "#/components/responses/Forbidden"
  /inventory/transfers:
    get:
      tags:
        - inventory
      operationId: listTransfers
      x-status: simulated
      x-approval: approved
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transfer"
    post:
      tags:
        - inventory
      operationId: createTransfer
      x-status: simulated
      x-approval: approved
      description: BR-INV-03 paso 1. Descuenta de la sede origen y deja las unidades en tránsito.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCreate"
      responses:
        "201":
          description: Traslado enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /inventory/transfers/{id}/receive:
    post:
      tags:
        - inventory
      operationId: receiveTransfer
      x-status: simulated
      x-approval: approved
      description: BR-INV-03 paso 2. Solo el encargado de la sede destino; suma al inventario destino.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Traslado recibido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /inventory/alerts:
    get:
      tags:
        - inventory
      operationId: listInventoryAlerts
      x-status: simulated
      x-approval: approved
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryAlert"
  /customers/{id}:
    put:
      tags:
        - catalog
      operationId: updateCustomer
      x-status: simulated
      x-approval: proposed
      description: Edita un cliente.
      parameters: &a1
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /suppliers/{id}:
    put:
      tags:
        - purchases
      operationId: updateSupplier
      x-status: simulated
      x-approval: proposed
      description: Edita un proveedor.
      parameters: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /employees/{id}:
    put:
      tags:
        - catalog
      operationId: updateEmployee
      x-status: simulated
      x-approval: proposed
      description: Edita un empleado (rol, sede, activo). Solo admin/propietario.
      parameters: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /branches:
    get:
      tags:
        - catalog
      operationId: listBranches
      x-status: simulated
      x-approval: proposed
      description: Sedes de la compañía.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchList"
  /purchase-orders/{id}/send:
    post:
      tags:
        - purchases
      operationId: sendPurchaseOrder
      x-status: simulated
      x-approval: proposed
      description: "`borrador` → `enviada`."
      parameters: *a1
      responses:
        "200":
          description: Enviada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /purchase-orders/{id}/receive:
    post:
      tags:
        - purchases
      operationId: receivePurchaseOrder
      x-status: simulated
      x-approval: proposed
      description: |
        `enviada` → `recibida`: entrada de inventario en la sede del usuario, recálculo del costo promedio (BR-PRO-06)
        y cuenta por pagar a `paymentTermsDays`. Exige `purchases.receive`. v0.5.0: la respuesta incluye `effect`
        (stock y costo antes/después por línea y la cuenta por pagar creada).
      parameters: *a1
      responses:
        "200":
          description: Recibida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrderReceipt"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /receivables/{id}/payments:
    get:
      tags:
        - ledger
      operationId: listReceivablePayments
      x-status: simulated
      x-approval: proposed
      description: Historial de abonos de una cuenta por cobrar (más reciente primero).
      parameters: *a1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReceivablePayment"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - ledger
      operationId: payReceivable
      x-status: simulated
      x-approval: proposed
      description: Abono. `PAYMENT_EXCEEDS_BALANCE` si supera el saldo.
      parameters: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerPayment"
      responses:
        "200":
          description: Abono aplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receivable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /payables/{id}/payments:
    post:
      tags:
        - ledger
      operationId: payPayable
      x-status: simulated
      x-approval: proposed
      description: Pago a proveedor. `PAYMENT_EXCEEDS_BALANCE` si supera el saldo.
      parameters: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerPayment"
      responses:
        "200":
          description: Pago aplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payable"
        "403":
